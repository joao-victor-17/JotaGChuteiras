<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
 <header>
    <h1>JotaG Chuteiras - Cadastro</h1>
    <nav id="menu">
      <ul>
       <li><a href="../Login/index.html">Voltar para a página de login</a></li>
      </ul>
   </nav>
 </header>
 <main>
  <h2>Faça parte do nosso time</h2>
   <form id="Cadastro">
     <label>Nome:</label>
     <input type="text" id="nome" name="nome" required placeholder="Digite seu nome" maxlength="50">
     
     <label>E-mail:</label>
     <input type="email" id="email" name="email" required placeholder="Digite seu e-mail" maxlength="50">
     
     <label>Senha:</label>
     <input type="password" id="senha" name="senha" required placeholder="Digite sua senha" maxlength="30" minlength="8">
     
     <label>Confirmar Senha:</label>
     <input type="password" id="confirmar-senha" name="confirmar-senha" required placeholder="Confirme sua senha" maxlength="30" minlength="8">
     
     <label>RG:</label>
     <input type="text" id="rg" name="rg" required placeholder="Digite o RG" maxlength="9">
     
     <label>CPF:</label>
     <input type="text" id="cpf" name="cpf" required placeholder="Digite o CPF" maxlength="11">

     <label>Data de nascimento:</label>
     <input type="date" id="data-nascimento" name="data-nascimento" required>

    <h3 id="Endereço">
      Endereço:
    </h3>
      <label>Rua:</label>
      <input type="text" id="rua" name="rua" required placeholder="Digite a rua" maxlength="100">

      <label>
        Número:
      </label>
      <input type="text" id="numero" name="numero" required placeholder="Digite o número" maxlength="10">

      <label>Bairro:</label>
      <input type="text" id="bairro" name="bairro" required placeholder="Digite o bairro" maxlength="100">

      <label>Cidade:</label>
      <input type="text" id="cidade" name="cidade" required placeholder="Digite a cidade" maxlength="100">

      <label>Estado:</label>
      <input type="text" id="estado" name="estado" required placeholder="Digite o estado" maxlength="100">

      <label>CEP:</label>
      <input type="text" id="cep" name="cep" required placeholder="Digite o CEP" maxlength="10">

      <label>País:</label>
      <input type="text" id="pais" name="pais" required placeholder="Digite o país" maxlength="100">

     <button  class="botaodois" type="submit">Cadastrar</button>

    
   </form>
 </main>

 <footer>
    <p>&copy; 2026 JotaG Chuteiras. Todos os direitos reservados.</p>
 </footer>

</body>

</html>
